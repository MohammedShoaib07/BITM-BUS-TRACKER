services:
  - type: web
    name: bitm-smartbus-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: bitm-bus-tracker-frontend
    runtime: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run start
